name: SuzuBoard image
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suzuboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Assert bundled admin assets and lockfile
        run: |
          test -s public/assets/admin/index.html
          test -f composer.lock
          test ! -e public/assets/admin/.git
          grep -q 'COPY . /www/' Dockerfile
          ! grep -q 'git clone' Dockerfile
      - name: PHP syntax check (changed application sources)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src php:8.2-cli-alpine sh -c 'find app database/migrations -name "*.php" -print0 | xargs -0 -n1 php -l >/dev/null'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ziruiya/suzuboard
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and optionally push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: true
      - name: Record immutable digest
        if: github.event_name != 'pull_request'
        run: |
          echo 'ghcr.io/ziruiya/suzuboard@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Deploy the digest, not a floating tag.' >> "$GITHUB_STEP_SUMMARY"
